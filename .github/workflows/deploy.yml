name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build-backend.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get lowercase repo name
        id: lowercase
        run: echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.lowercase.outputs.repo }}/backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.lowercase.outputs.repo }}/frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./webapi
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Build and push frontend
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./webui
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Output build summary
        run: |
          echo "## 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 后端镜像" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.meta-backend.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 前端镜像" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.meta-frontend.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            
            echo "=========================================="
            echo "WMS 智能仓储系统 - 自动部署"
            echo "环境: ${{ github.event.inputs.environment || 'production' }}"
            echo "镜像版本: ${{ github.sha }}"
            echo "=========================================="
            
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/wms' }}"
            
            echo "创建部署目录..."
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            
            # 配置 Docker 镜像加速器
            echo "配置 Docker 镜像加速器..."
            sudo mkdir -p /etc/docker
            sudo tee /etc/docker/daemon.json > /dev/null << 'DOCKEREOF'
            {
              "registry-mirrors": [
                "https://docker.m.daocloud.io",
                "https://docker.1panel.live",
                "https://hub.rat.dev"
              ]
            }
            DOCKEREOF
            
            # 重启 Docker（仅在配置变更时）
            if ! sudo diff -q /etc/docker/daemon.json /etc/docker/daemon.json.bak 2>/dev/null; then
              echo "重启 Docker 服务..."
              sudo cp /etc/docker/daemon.json /etc/docker/daemon.json.bak
              sudo systemctl daemon-reload
              sudo systemctl restart docker || sudo service docker restart || true
              sleep 5
            fi
            
            # 确定 compose 命令
            if docker compose version &> /dev/null; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              echo "错误: docker-compose 未安装"
              exit 1
            fi
            echo "使用: $COMPOSE_CMD"
            
            # 备份 .env 文件
            ENV_BACKUP=""
            if [ -f .env ]; then
              echo "备份 .env 文件..."
              ENV_BACKUP=$(cat .env)
            fi
            
            # 清理旧代码
            echo "清理旧代码..."
            rm -rf * 2>/dev/null || true
            rm -rf .git 2>/dev/null || true
            rm -rf .[!.]* 2>/dev/null || true
            
            # 克隆代码
            echo "克隆最新代码..."
            CLONE_SUCCESS=false
            
            if git clone --depth 1 https://github.com/${{ github.repository }}.git . 2>/dev/null; then
              CLONE_SUCCESS=true
              echo "GitHub 克隆成功"
            fi
            
            if [ "$CLONE_SUCCESS" = false ]; then
              if git clone --depth 1 https://gitclone.com/github.com/${{ github.repository }}.git . 2>/dev/null; then
                CLONE_SUCCESS=true
                echo "GitClone 镜像克隆成功"
              fi
            fi
            
            if [ "$CLONE_SUCCESS" = false ]; then
              echo "错误: 克隆失败"
              exit 1
            fi
            
            # 恢复 .env 文件
            if [ -n "$ENV_BACKUP" ]; then
              echo "恢复 .env 文件..."
              echo "$ENV_BACKUP" > .env
            elif [ ! -f .env ]; then
              echo "创建 .env 文件..."
              cat > .env << EOF
            DB_HOST=db
            DB_PORT=5432
            DB_DATABASE=wms
            DB_USERNAME=postgres
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            IMAGE_BACKEND=wms-backend:current
            IMAGE_FRONTEND=wms-frontend:current
            EOF
            fi
            
            # 拉取基础镜像
            echo "拉取基础镜像..."
            sudo docker pull docker.m.daocloud.io/library/python:3.12-slim || true
            sudo docker pull docker.m.daocloud.io/library/node:20-alpine || true
            sudo docker pull docker.m.daocloud.io/library/nginx:alpine || true
            sudo docker pull docker.m.daocloud.io/library/postgres:16-alpine || true
            sudo docker pull docker.m.daocloud.io/library/redis:7-alpine || true
            
            # 备份当前镜像
            echo "备份当前镜像..."
            if sudo docker inspect wms-backend:current &> /dev/null; then
              sudo docker tag wms-backend:current wms-backend:previous 2>/dev/null || true
            fi
            if sudo docker inspect wms-frontend:current &> /dev/null; then
              sudo docker tag wms-frontend:current wms-frontend:previous 2>/dev/null || true
            fi
            
            # 构建新镜像
            echo "构建后端镜像..."
            sudo docker build -t wms-backend:current ./webapi
            
            echo "构建前端镜像..."
            sudo docker build -t wms-frontend:current ./webui
            
            # 停止旧容器
            echo "停止旧容器..."
            $COMPOSE_CMD -f docker-compose.prod.yaml stop backend frontend 2>/dev/null || true
            $COMPOSE_CMD -f docker-compose.prod.yaml rm -f backend frontend 2>/dev/null || true
            
            # 启动新容器（不带 --no-deps，让 compose 处理依赖）
            echo "启动新容器..."
            $COMPOSE_CMD -f docker-compose.prod.yaml up -d
            
            # 等待容器启动
            echo "等待容器启动..."
            sleep 15
            
            # 显示容器状态
            echo "========== 容器状态 =========="
            sudo docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            
            # 显示后端日志
            echo "========== 后端启动日志 =========="
            $COMPOSE_CMD -f docker-compose.prod.yaml logs backend 2>&1 | tail -50
            
            # 健康检查
            echo "执行健康检查..."
            BACKEND_HEALTHY=false
            FRONTEND_HEALTHY=false
            
            for i in {1..10}; do
              echo "健康检查尝试 $i/10..."
              
              BACKEND_CONTAINER=$(sudo docker ps -q -f name=backend)
              FRONTEND_CONTAINER=$(sudo docker ps -q -f name=frontend)
              
              if [ -n "$BACKEND_CONTAINER" ]; then
                if sudo docker exec $BACKEND_CONTAINER curl -sf http://localhost:8010/api/ping &>/dev/null; then
                  BACKEND_HEALTHY=true
                  echo "✓ 后端服务健康"
                fi
              fi
              
              if [ -n "$FRONTEND_CONTAINER" ]; then
                if sudo docker exec $FRONTEND_CONTAINER curl -sf http://localhost:8011/ &>/dev/null; then
                  FRONTEND_HEALTHY=true
                  echo "✓ 前端服务健康"
                fi
              fi
              
              if [ "$BACKEND_HEALTHY" = true ] && [ "$FRONTEND_HEALTHY" = true ]; then
                break
              fi
              
              sleep 10
            done
            
            if [ "$BACKEND_HEALTHY" = false ] || [ "$FRONTEND_HEALTHY" = false ]; then
              echo "❌ 健康检查失败"
              
              echo "========== 后端完整日志 =========="
              $COMPOSE_CMD -f docker-compose.prod.yaml logs backend 2>&1 | tail -100
              
              echo "========== 数据库日志 =========="
              $COMPOSE_CMD -f docker-compose.prod.yaml logs db 2>&1 | tail -30
              
              echo "执行回滚..."
              
              if sudo docker inspect wms-backend:previous &> /dev/null; then
                sudo docker tag wms-backend:previous wms-backend:current
                $COMPOSE_CMD -f docker-compose.prod.yaml up -d --no-deps backend
              fi
              
              if sudo docker inspect wms-frontend:previous &> /dev/null; then
                sudo docker tag wms-frontend:previous wms-frontend:current
                $COMPOSE_CMD -f docker-compose.prod.yaml up -d --no-deps frontend
              fi
              
              echo "回滚完成，请检查日志"
              exit 1
            fi
            
            # 清理旧镜像
            echo "清理无用镜像..."
            sudo docker image prune -af --filter "until=24h"
            
            echo "=========================================="
            echo "✓ 部署完成！"
            echo "=========================================="
            $COMPOSE_CMD -f docker-compose.prod.yaml ps

      - name: Verify deployment
        run: |
          echo "验证外部访问..."
          
          for i in {1..10}; do
            if curl -sf http://${{ secrets.DEPLOY_HOST }}:8010/api/ping; then
              echo "✓ 后端服务可访问 (端口 8010)"
              break
            fi
            echo "等待后端服务... ($i/10)"
            sleep 5
          done
          
          for i in {1..10}; do
            if curl -sf http://${{ secrets.DEPLOY_HOST }}:8011/; then
              echo "✓ 前端服务可访问 (端口 8011)"
              break
            fi
            echo "等待前端服务... ($i/10)"
            sleep 5
          done

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::部署失败，请检查服务器日志"
          echo "## ❌ 部署失败" >> $GITHUB_STEP_SUMMARY
          echo "请检查服务器日志获取详细信息" >> $GITHUB_STEP_SUMMARY

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Clean up old images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "清理超过 7 天的未使用镜像..."
            sudo docker image prune -af --filter "until=168h"
            sudo docker system prune -f
