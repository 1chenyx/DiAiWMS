name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/wms-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./webapi
          file: ./webapi/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/wms-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./webui
          file: ./webui/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "创建部署目录..."
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "创建 .env 文件..."
            cat > .env << 'EOF'
            # 数据库配置
            DB_HOST=db
            DB_PORT=5432
            DB_DATABASE=wms
            DB_USERNAME=postgres
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            
            # Redis 配置
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            EOF
            
            echo "创建 docker-compose 配置文件..."
            cat > docker-compose.prod.yaml << 'EOF'
            services:
              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/wms-backend:latest
                restart: unless-stopped
                environment:
                  app_env: prod
                  DB_HOST: \${DB_HOST:-db}
                  DB_PORT: \${DB_PORT:-5432}
                  DB_DATABASE: \${DB_DATABASE:-wms}
                  DB_USERNAME: \${DB_USERNAME:-postgres}
                  DB_PASSWORD: \${DB_PASSWORD}
                  REDIS_HOST: \${REDIS_HOST:-redis}
                  REDIS_PORT: \${REDIS_PORT:-6379}
                  REDIS_PASSWORD: \${REDIS_PASSWORD}
                volumes:
                  - ./logs:/backend/logs
                ports:
                  - "8010:8000"
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                networks:
                  - wms-network
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000/api/ping"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s

              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/wms-frontend:latest
                restart: unless-stopped
                ports:
                  - "8011:80"
                depends_on:
                  - backend
                networks:
                  - wms-network
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3

              db:
                image: postgres:16-alpine
                restart: unless-stopped
                environment:
                  POSTGRES_DB: \${DB_DATABASE:-wms}
                  POSTGRES_USER: \${DB_USERNAME:-postgres}
                  POSTGRES_PASSWORD: \${DB_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                expose:
                  - "5432"
                networks:
                  - wms-network
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U \${DB_USERNAME:-postgres}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              redis:
                image: redis:7-alpine
                restart: unless-stopped
                command: redis-server --requirepass \${REDIS_PASSWORD}
                volumes:
                  - redis_data:/data
                expose:
                  - "6379"
                networks:
                  - wms-network
                healthcheck:
                  test: ["CMD", "redis-cli", "-a", "\${REDIS_PASSWORD}", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

            volumes:
              postgres_data:
              redis_data:

            networks:
              wms-network:
                driver: bridge
            EOF
            
            echo "创建 Nginx 配置文件（供现有 nginx 使用）..."
            cat > wms-nginx.conf << 'EOF'
            # WMS 后端 API
            server {
                listen 80;
                server_name wmsapi.githubtool.com;
                
                location / {
                    proxy_pass http://127.0.0.1:8010;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_connect_timeout 60s;
                    proxy_send_timeout 60s;
                    proxy_read_timeout 60s;
                }
            }
            
            # WMS 前端
            server {
                listen 80;
                server_name wms.githubtool.com;
                
                location / {
                    proxy_pass http://127.0.0.1:8011;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF
            
            echo "登录 Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            echo "拉取最新镜像..."
            docker compose -f docker-compose.prod.yaml pull
            
            echo "停止旧容器..."
            docker compose -f docker-compose.prod.yaml down
            
            echo "启动新容器..."
            docker compose -f docker-compose.prod.yaml up -d
            
            echo "清理无用镜像..."
            docker image prune -f
            
            echo "部署完成！"
            docker compose -f docker-compose.prod.yaml ps
            
            echo ""
            echo "=========================================="
            echo "请将 wms-nginx.conf 配置添加到现有 nginx 中"
            echo "配置文件位置: ${{ secrets.DEPLOY_PATH }}/wms-nginx.conf"
            echo "=========================================="

      - name: Health check
        run: |
          echo "等待服务启动..."
          sleep 30
          
          curl -f http://${{ secrets.DEPLOY_HOST }}:8010/api/ping || exit 1
          echo "后端服务正常 (端口 8010)"
          
          curl -f http://${{ secrets.DEPLOY_HOST }}:8011/ || exit 1
          echo "前端服务正常 (端口 8011)"
