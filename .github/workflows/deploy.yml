name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "检查并安装 git..."
            if ! command -v git &> /dev/null; then
              echo "安装 git..."
              apt-get update && apt-get install -y git || yum install -y git
            fi
            
            echo "创建部署目录..."
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "拉取最新代码..."
            if [ -d ".git" ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            echo "创建 .env 文件..."
            cat > .env << 'EOF'
            # 数据库配置
            DB_HOST=db
            DB_PORT=5432
            DB_DATABASE=wms
            DB_USERNAME=postgres
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            
            # Redis 配置
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            EOF
            
            echo "构建后端镜像..."
            docker build -t wms-backend:latest ./webapi
            
            echo "构建前端镜像..."
            docker build -t wms-frontend:latest ./webui
            
            echo "停止旧容器..."
            docker-compose -f docker-compose.prod.yaml down || docker compose -f docker-compose.prod.yaml down || true
            
            echo "启动新容器..."
            docker-compose -f docker-compose.prod.yaml up -d || docker compose -f docker-compose.prod.yaml up -d
            
            echo "清理无用镜像..."
            docker image prune -f
            
            echo "部署完成！"
            docker-compose -f docker-compose.prod.yaml ps || docker compose -f docker-compose.prod.yaml ps

      - name: Health check
        run: |
          echo "等待服务启动..."
          sleep 30
          
          curl -f http://${{ secrets.DEPLOY_HOST }}:8010/api/ping || exit 1
          echo "后端服务正常 (端口 8010)"
          
          curl -f http://${{ secrets.DEPLOY_HOST }}:8011/ || exit 1
          echo "前端服务正常 (端口 8011)"
