# LangChain Agent Demo 默认配置文件
# 这个配置文件定义了Agent的所有核心参数

# LLM配置 - 支持多种提供者
llm:
  provider: openai  # 可选值: openai, anthropic, azure, huggingface, ollama
  model_name: gpt-3.5-turbo
  temperature: 0.7
  max_tokens: 2000
  api_key: ${OPENAI_API_KEY}  # 从环境变量读取
  api_base: null
  timeout: 60
  max_retries: 3
  fallback_providers: []  # 备用提供者列表

# 记忆配置 - 支持多种存储后端
memory:
  backend: in_memory  # 可选值: in_memory, redis, sqlite, postgresql
  max_history: 10
  enable_summarization: false
  summarization_threshold: 5
  
  # Redis配置（当backend为redis时使用）
  redis_host: localhost
  redis_port: 6379
  redis_db: 0
  redis_password: null
  
  # SQLite配置（当backend为sqlite时使用）
  sqlite_path: ":memory:"
  
  # PostgreSQL配置（当backend为postgresql时使用）
  postgres_host: localhost
  postgres_port: 5432
  postgres_database: agent_memory
  postgres_user: null
  postgres_password: null

# Agent配置
agent:
  name: "LangChain学习助手"
  type: react  # 可选值: react, conversational, structured_chat, plan_and_execute
  verbose: true
  max_iterations: 10
  early_stopping_method: generate
  handle_parsing_errors: true
  return_intermediate_steps: false

# 系统提示词配置
system_prompt:
  persona: "你是一个专业的AI助手，擅长使用工具解决问题，并且能够进行深度思考"
  rules:
    - "始终以专业和友好的方式回答用户问题"
    - "在使用工具前，先分析问题并制定计划"
    - "如果工具调用失败，尝试其他方法或提供替代方案"
    - "保持对话的上下文连贯性"
  constraints:
    - "不要编造信息，如果不确定就说不知道"
    - "不要执行危险或有害的操作"
    - "保护用户的隐私信息"
  capabilities:
    - "信息检索"
    - "数据分析"
    - "代码生成"
    - "问题解决"
  custom_instructions: |
    你是一个学习用的AI Agent演示系统。请展示你的思考过程，
    合理使用可用的工具，并清晰地解释你的决策。

# 工具配置
tools:
  - name: calculator
    enabled: true
    config:
      description: "执行数学计算"
  
  - name: search
    enabled: true
    config:
      description: "搜索信息"
      max_results: 5
  
  - name: datetime
    enabled: true
    config:
      description: "获取当前日期时间"
  
  - name: code_executor
    enabled: true
    config:
      description: "执行Python代码"
      timeout: 30

# 技能配置
skills:
  - name: reasoning
    enabled: true
    priority: 10
    config:
      description: "深度推理能力"
      enable_chain_of_thought: true
  
  - name: planning
    enabled: true
    priority: 8
    config:
      description: "任务规划能力"
      max_steps: 5
  
  - name: analysis
    enabled: true
    priority: 6
    config:
      description: "数据分析能力"
      enable_visualization: false
  
  - name: creativity
    enabled: true
    priority: 4
    config:
      description: "创造性思维"
      temperature_boost: 0.2
