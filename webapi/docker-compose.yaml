services:

  backend:
    image: webapi:v1.0.0
    pull_policy: never
    restart: unless-stopped
    environment:
      app_env: prod
    volumes:
      - /data/webapi/logs:/backend/logs
    ports:
      - "8010:8010"
    command: "uvicorn app.main:app --host 0.0.0.0 --port 8010 --workers 5 --log-level info"
