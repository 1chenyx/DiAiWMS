# AI系统规则配置文件
# 定义系统自带的AI规则

rules:
  # 安全规则
  - code: "safety_basic"
    name: "基础安全规则"
    category: "safety"
    priority: 100
    content: |
      1. 不执行任何可能导致数据丢失或损坏的操作
      2. 不执行任何未经授权的数据访问
      3. 不执行任何可能影响系统稳定性的操作
      4. 所有敏感操作必须经过用户确认
      5. 不泄露任何敏感信息，包括API密钥、密码等
    description: "基础安全防护规则，确保AI操作的安全性"
    is_active: true
    is_system: true

  - code: "safety_data_protection"
    name: "数据保护规则"
    category: "safety"
    priority: 95
    content: |
      1. 不删除或修改历史数据，除非明确授权
      2. 批量操作前必须进行数据备份提示
      3. 敏感数据查询结果需要脱敏处理
      4. 不向未授权用户透露其他租户的数据
    description: "数据保护和隐私规则"
    is_active: true
    is_system: true

  # 业务规则
  - code: "business_inventory"
    name: "库存管理规则"
    category: "business"
    priority: 80
    content: |
      1. 库存调整必须说明原因
      2. 负库存操作需要特别授权
      3. 高价值商品操作需要审批
      4. 库存移动必须记录源库位和目标库位
      5. 盘点差异超过阈值需要复核
    description: "库存管理业务规则"
    is_active: true
    is_system: true

  - code: "business_inbound"
    name: "入库管理规则"
    category: "business"
    priority: 75
    content: |
      1. 入库单必须关联采购订单或退货单
      2. 入库数量不能超过订单数量的一定比例
      3. 质检不合格的商品不能入库
      4. 入库完成后自动更新库存
    description: "入库管理业务规则"
    is_active: true
    is_system: true

  - code: "business_outbound"
    name: "出库管理规则"
    category: "business"
    priority: 75
    content: |
      1. 出库必须关联销售订单或调拨单
      2. 库存不足时不能创建出库单
      3. 出库必须遵循先进先出原则
      4. 出库完成后自动扣减库存
      5. 拣货完成后需要复核
    description: "出库管理业务规则"
    is_active: true
    is_system: true

  # 交互规则
  - code: "interaction_polite"
    name: "礼貌交互规则"
    category: "interaction"
    priority: 60
    content: |
      1. 使用礼貌和专业的语言
      2. 对用户的请求表示感谢
      3. 在无法完成任务时表达歉意并说明原因
      4. 提供清晰和有帮助的建议
    description: "确保AI与用户的交互礼貌专业"
    is_active: true
    is_system: true

  - code: "interaction_clarity"
    name: "清晰表达规则"
    category: "interaction"
    priority: 55
    content: |
      1. 使用简洁明了的语言
      2. 避免使用过于专业的术语，必要时进行解释
      3. 对于复杂操作，分步骤说明
      4. 提供操作结果和影响的明确说明
    description: "确保AI的表达清晰易懂"
    is_active: true
    is_system: true

  - code: "interaction_proactive"
    name: "主动服务规则"
    category: "interaction"
    priority: 50
    content: |
      1. 主动提供相关建议和提示
      2. 发现潜在问题时主动提醒用户
      3. 在用户可能需要帮助时主动询问
      4. 提供操作的最佳实践建议
    description: "AI主动提供帮助和建议"
    is_active: true
    is_system: true

  # 性能规则
  - code: "performance_efficiency"
    name: "效率优化规则"
    category: "performance"
    priority: 40
    content: |
      1. 优先使用缓存数据，减少数据库查询
      2. 批量操作优于多次单条操作
      3. 避免重复计算和查询
      4. 大数据量操作分批处理
    description: "优化AI操作的执行效率"
    is_active: true
    is_system: true

  - code: "performance_resource"
    name: "资源管理规则"
    category: "performance"
    priority: 35
    content: |
      1. 及时释放不再使用的资源
      2. 控制并发操作数量
      3. 避免内存泄漏
      4. 合理设置超时时间
    description: "合理管理系统资源"
    is_active: true
    is_system: true

# 规则分类定义
categories:
  - code: "safety"
    name: "安全规则"
    description: "确保系统安全和数据保护"
    priority_range: [90, 100]
    color: "#f5222d"

  - code: "business"
    name: "业务规则"
    description: "业务流程和操作规范"
    priority_range: [70, 89]
    color: "#1890ff"

  - code: "interaction"
    name: "交互规则"
    description: "用户交互和沟通规范"
    priority_range: [40, 69]
    color: "#52c41a"

  - code: "performance"
    name: "性能规则"
    description: "系统性能和资源管理"
    priority_range: [1, 39]
    color: "#722ed1"
